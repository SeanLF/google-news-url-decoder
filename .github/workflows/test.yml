name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The first entry must be whatever python_requires says in setup.py. A floor nobody
        # runs is a claim, not a guarantee -- and this package is one `X | None` annotation
        # away from breaking it at import time.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package as a user would
        # Install the built package rather than testing the source tree in place, so a missing
        # entry in `packages` or a dependency that only happens to be present locally fails
        # here instead of on someone's `pip install`.
        run: |
          python -m pip install --upgrade pip
          pip install ".[all]" pytest

      - name: Run tests against the installed package
        # From outside the repo root, and with the flag set, so conftest refuses to run if the
        # checkout is imported instead. Without both, this job silently tests the source tree
        # beside the artifact and proves nothing about the artifact.
        working-directory: /tmp
        env:
          TEST_INSTALLED_PACKAGE: "1"
        run: pytest "$GITHUB_WORKSPACE/tests" -q

  import-without-extras:
    name: import with no extras installed
    runs-on: ubuntu-latest
    # `import googlenewsdecoder` raised ModuleNotFoundError for httpx on a plain install,
    # because __init__ imported the async decoder while setup.py never required it. That is
    # invisible to the matrix above, which installs [all]. This job is the regression test.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install . pytest
      - name: The package must import, and async must name the extra when used
        working-directory: /tmp
        env:
          TEST_INSTALLED_PACKAGE: "1"
        run: pytest "$GITHUB_WORKSPACE/tests/test_optional_extras.py" -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  architecture:
    name: import-linter
    runs-on: ubuntu-latest
    # The layering is claimed in CONTRIBUTING and in the protocol docstring. A claim in prose
    # decays the first time someone adds a convenient import; this makes it a build failure.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ".[all]" import-linter
      - run: lint-imports
